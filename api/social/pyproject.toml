[project]
name = "tren-solar-social"
version = "0.1.0"
description = "Conexiones, adaptadores y publicaciones en LinkedIn y X (issue #5)"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx2>=2.9",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "uvicorn>=0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
