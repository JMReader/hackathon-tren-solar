[project]
name = "tren-solar-social"
version = "0.1.0"
description = "Conexiones, adaptadores y publicaciones en LinkedIn y X (issue #5)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx2>=2.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
