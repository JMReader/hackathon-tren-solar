<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tren Solar · prueba social (dev)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  fieldset { margin-bottom: 1.5rem; border: 1px solid #ccc; border-radius: 8px; }
  textarea, input, select { width: 100%; box-sizing: border-box; margin: .25rem 0 .75rem; font: inherit; }
  button { margin: .25rem .5rem .25rem 0; padding: .5rem .9rem; font: inherit; cursor: pointer; }
  pre { background: #f5f5f5; padding: .75rem; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .warn { color: #8a5a00; }
</style>
</head>
<body>
<h1>Prueba local de publicación social</h1>
<p class="warn">Página sólo para desarrollo. Publica de verdad en tu cuenta cuando la red está conectada.</p>

<fieldset>
  <legend>1. Conexiones</legend>
  <button id="refresh">Actualizar estado</button>
  <button id="connect-linkedin">Conectar LinkedIn</button>
  <button id="connect-x">Conectar X</button>
  <pre id="status">…</pre>
</fieldset>

<fieldset>
  <legend>2. Borrador</legend>
  <form id="draft-form">
    <label>Red <select name="platform"><option value="linkedin">LinkedIn</option><option value="x">X</option></select></label>
    <label>Texto <textarea name="body" rows="6" required></textarea></label>
    <label>Foto (opcional, JPG/PNG) <input type="file" name="photo" accept="image/jpeg,image/png"></label>
    <label>Texto alternativo de la foto <input name="alt_text"></label>
    <button type="submit">Crear borrador</button>
  </form>
  <pre id="draft">Sin borrador.</pre>
</fieldset>

<fieldset>
  <legend>3. Publicar</legend>
  <button id="publish" disabled>Publicar directo</button>
  <button id="retry-same-key" disabled>Reenviar con la misma clave</button>
  <button id="assisted" disabled>Publicación asistida</button>
  <pre id="result">…</pre>
</fieldset>

<script>
const api = "/api/v1";
let draft = null, lastKey = null;
const show = (id, value) => { document.getElementById(id).textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2); };

async function refresh() {
  const rows = await Promise.all(["linkedin", "x"].map(p => fetch(`${api}/social/${p}/connection`).then(r => r.json())));
  const params = new URLSearchParams(location.search);
  const callback = params.get("social") ? { callback: Object.fromEntries(params) } : {};
  show("status", { ...callback, connections: rows });
}

document.getElementById("refresh").onclick = refresh;
const connect = (platform) => async () => {
  const r = await fetch(`${api}/social/${platform}/connection`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ return_to: "/dev" }),
  });
  const body = await r.json();
  if (r.ok) location.href = body.authorization_url; else show("status", { http: r.status, body });
};
document.getElementById("connect-linkedin").onclick = connect("linkedin");
document.getElementById("connect-x").onclick = connect("x");

document.getElementById("draft-form").onsubmit = async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  if (!form.get("photo") || !form.get("photo").size) form.delete("photo");
  const r = await fetch("/dev/drafts", { method: "POST", body: form });
  const body = await r.json();
  if (!r.ok) return show("draft", { http: r.status, body });
  draft = { ...body, text: form.get("body") };
  lastKey = null;
  show("draft", draft);
  for (const id of ["publish", "assisted"]) document.getElementById(id).disabled = false;
  document.getElementById("retry-same-key").disabled = true;
};

async function publish(key) {
  const r = await fetch(`${api}/drafts/${draft.draft_id}/publications`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Idempotency-Key": key },
    body: JSON.stringify({ draft_revision: draft.draft_revision, confirm_publish: true }),
  });
  show("result", { http: r.status, replayed: r.headers.get("Idempotent-Replayed") === "true", body: await r.json() });
}

document.getElementById("publish").onclick = async () => {
  const photo = draft.has_photo ? "con foto" : "sin foto";
  if (!confirm(`¿Publicar en ${draft.platform} (${photo})?\n\n${draft.text}`)) return;
  lastKey = crypto.randomUUID();
  document.getElementById("retry-same-key").disabled = false;
  await publish(lastKey);
};
document.getElementById("retry-same-key").onclick = () => publish(lastKey);
document.getElementById("assisted").onclick = async () => {
  const r = await fetch(`${api}/drafts/${draft.draft_id}/assisted-share`);
  const body = await r.json();
  show("result", { http: r.status, body });
  if (r.ok) window.open(body.composer_url, "_blank", "noopener,noreferrer");
};

refresh();
</script>
</body>
</html>
