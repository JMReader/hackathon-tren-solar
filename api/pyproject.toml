[project]
name = "tren-solar-core"
version = "0.1.0"
description = "Motor modular (issue #3): ingesta text/audio/mcp, extraccion de hechos, revision y borradores LinkedIn/X"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.9",
  "mcp>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
